# TQSC v2.0 — Docker Compose
# Uso: TQSC_API_KEY=secreto docker compose up -d
services:
  tqsc:
    build: .
    container_name: tqsc
    restart: unless-stopped
    ports:
      - "${HUD_PORT:-9090}:9090"
      - "${HONEYPOT_PORT:-2222}:2222"
    environment:
      - TQSC_API_KEY=${TQSC_API_KEY?API key requerida}
      - TQSC_DOCKER=1
      - TQSC_TEST_MODE=0
      - PYTHONUNBUFFERED=1
    volumes:
      - tqsc_data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: false  # tini ya está en la imagen
    mem_limit: 1g
    mem_reservation: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  tqsc_data:
