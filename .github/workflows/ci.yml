name: TQSC CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install scikit-learn joblib numpy cryptography pynacl psutil geopy

      - name: Compile check
        run: python -m compileall tqsc/ -q

      - name: Lint
        run: pip install pyflakes && pyflakes tqsc/ 2>&1 | head -20; echo "lint done"

      - name: Tests
        run: |
          export TQSC_TEST_MODE=1
          for t in tests/*.py; do python "$t" || echo "FAIL: $t"; done

      - name: TQSC boots
        run: |
          export TQSC_TEST_MODE=1
          python run.py --test

  build-rust:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build tqsc-native
        run: cd tqsc-native && cargo build --release && echo "Rust build OK"
